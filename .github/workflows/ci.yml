# Tests for both engines on every push to main and every pull request (NOTES item 4).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }}${{ matrix.scipy && ' + scipy' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.11 is the version that generates the golden vectors. It also installs
          # numpy and scipy, so the optional Radau cross-check runs instead of skipping.
          - python: "3.11"
            scipy: true
          - python: "3.13"
            scipy: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install numpy and scipy (cross-check test only; kirk/ uses the standard library)
        if: matrix.scipy
        run: python -m pip install numpy scipy
      - name: Unit tests
        run: python -m unittest -v
      - name: Validate the example library
        run: python -W error -m kirk.libformat.validate libraries/triga-jsi

  typescript:
    name: TypeScript (Node 24)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      # The validator parity test runs the Python validator.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
        env:
          VR_PYTHON: python
      - run: npm run typecheck

  packages:
    name: Packages (build, install, smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: js/package-lock.json
      - name: js/LICENSE is a copy of LICENSE
        run: cmp LICENSE js/LICENSE
      - name: Build the Python sdist and wheel
        run: |
          python -m pip install build
          python -m build --outdir "$RUNNER_TEMP/py" .
      - name: Install the wheel in a clean venv and smoke-test it outside the repository
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install "$RUNNER_TEMP"/py/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/python" -I "$GITHUB_WORKSPACE/tests/installed_smoke.py" "$GITHUB_WORKSPACE"
      - name: Pack the npm tarball
        working-directory: js
        run: |
          npm ci --ignore-scripts
          npm pack --pack-destination "$RUNNER_TEMP/npm"
      - name: Install the tarball in a clean folder, smoke-test it and typecheck a consumer
        run: |
          cd "$RUNNER_TEMP/npm"
          echo '{"name": "consumer", "private": true, "type": "module"}' > package.json
          npm install --no-audit --no-fund ./kirk-kinetics-*.tgz
          cp "$GITHUB_WORKSPACE/js/scripts/installed-smoke.mjs" "$GITHUB_WORKSPACE/js/scripts/consumer-check.ts" .
          node installed-smoke.mjs "$GITHUB_WORKSPACE"
          "$GITHUB_WORKSPACE/js/node_modules/.bin/tsc" --noEmit --strict --module nodenext --moduleResolution nodenext \
            --target es2023 --types node --typeRoots "$GITHUB_WORKSPACE/js/node_modules/@types" consumer-check.ts

  line-endings:
    name: LF line endings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No CR bytes in tracked text files
        run: |
          if git grep -I -l $'\r' -- . ':!*.bin'; then
            echo "The files above contain CR bytes; the repository uses LF only." >&2
            exit 1
          fi
